[project]
name = "robot-inference-service"
version = "0.1.0"
description = "YOLO inference service for robot vision"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "ultralytics>=8.0.0",  # YOLOv8
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]



[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]