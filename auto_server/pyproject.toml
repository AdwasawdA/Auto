[project]
name = "robot-car-service"
version = "0.1.0"
description = "Robot car camera and control service"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-sock>=0.7.0",
    "websockets>=12.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "picamera2>=0.3.12; platform_machine=='aarch64'",  # Only on RPi
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]