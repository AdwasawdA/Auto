[project]
name = "car-control"
version = "0.1.0"
description = "WebSocket car control server for Raspberry Pi 4"
requires-python = ">=3.10"

dependencies = [
"flask>=3.0.0",
"flask-sock>=0.7.0",
"websockets>=12.0",
"opencv-python>=4.8.0",
"numpy>=1.24.0",
"pillow>=10.0.0",
"python-dotenv>=1.0.0",
"picamera2>=0.3.12; platform_machine=='aarch64'",
"adafruit-blinka>=1.0",
"adafruit-platformdetect>=1.0",
"RPi.GPIO>=0.7",
"adafruit-circuitpython-pca9685>=3.4",
"adafruit-circuitpython-motor>=3.4",
"adafruit-circuitpython-vl53l0x>=3.6",
"werkzeug<=3.1.0",
"pmw3901>=1.0.0",
"gpiodevice>=0.0.5"
]

[project.optional-dependencies]
rpi = [
"RPi.GPIO>=0.7",
"adafruit-circuitpython-pca9685>=3.4",
"adafruit-circuitpython-motor>=3.4",
"adafruit-circuitpython-vl53l0x>=3.6",
]
dev = [
"pytest>=8.0",
"pytest-cov>=5.0",
"black>=23.0.0",
"ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["server"]
omit = ["tests/*", "pohyb2.py", "car_setup.py"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

